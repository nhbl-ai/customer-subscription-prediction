name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and experiment dependencies
        run: python -m pip install -e ".[experiments]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Test with synthetic data (no UCI download)
        run: python -m unittest discover -s tests -v
      - name: Check CLI entry points
        run: |
          subscription-train --help
          subscription-predict --help
          subscription-experiment --help
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
